<!doctype html>
<!-- build-trigger: 2026-09-24 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Football Wire｜全球足球中文快讯</title>
<style>
*{box-sizing:border-box}:root{--bg:#06100c;--panel:#0c1813;--line:#233b31;--text:#f3f8f5;--muted:#8ca198;--green:#63e7a1;--gold:#ffd27a;--blue:#9dc7ff}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% -8%,#19472e,transparent 31%),var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
.wrap{width:min(1000px,calc(100% - 24px));margin:auto}header{padding:28px 0 13px}h1{margin:0;font-size:clamp(31px,6vw,52px);letter-spacing:-.05em}.sub{margin-top:9px;color:var(--muted);font-size:13px;line-height:1.7}
.toolbar{position:sticky;top:0;z-index:9;background:#06100cef;backdrop-filter:blur(15px);padding:10px 0;border-bottom:1px solid #14251e}.row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}.row:last-child{margin-bottom:0}
button,input{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 11px;font:inherit}button{cursor:pointer;font-size:13px}button.active{background:var(--green);border-color:var(--green);color:#052014;font-weight:800}input{flex:1;min-width:200px;outline:none}
.meta{display:flex;gap:11px;flex-wrap:wrap;padding:12px 0;color:var(--muted);font-size:12px}.good{color:#a7edc7}.warn{color:var(--gold)}
.top{border:1px solid #315342;background:linear-gradient(135deg,#14281f,#0b1712);border-radius:16px;padding:15px 16px;margin:3px 0 12px}.top .label{font-size:11px;color:var(--gold);margin-bottom:7px}.top .title{font-size:20px}
.list{display:flex;flex-direction:column;gap:7px;padding-bottom:42px}.item{border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#0f1d17,#0a1511);padding:13px 14px}.info{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:10.5px;margin-bottom:6px}.tag{border:1px solid #345546;border-radius:999px;padding:3px 6px;color:#d9eee4}.tag.confirm{border-color:#36516f;color:var(--blue)}.title{font-size:16.5px;font-weight:850;line-height:1.5}
.empty{text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}footer{text-align:center;color:#5d756a;font-size:11.5px;line-height:1.75;padding:0 0 28px}@media(max-width:650px){.title{font-size:16px}.top .title{font-size:18px}}
</style></head>
<body><div class="wrap"><header><h1>Football Wire</h1><div class="sub">全球足球中文标题流 · RSSHub + Miniflux · 自托管翻译 · 同事件只保留最新进展</div></header>
<div class="toolbar">
<div class="row"><button class="tier active" data-tier="全部">全部来源</button><button class="tier" data-tier="官方">官方</button><button class="tier" data-tier="转会专家">转会专家</button><button class="tier" data-tier="国际媒体">国际媒体</button><button class="tier" data-tier="中文媒体">中文媒体</button><input id="q" placeholder="搜索球员、球队、教练……"><button id="refresh">刷新</button></div>
<div class="row"><button class="cat active" data-cat="全部">全部</button><button class="cat" data-cat="转会">转会</button><button class="cat" data-cat="球星">球星</button><button class="cat" data-cat="伤停">伤停</button><button class="cat" data-cat="比赛">比赛</button><button class="cat" data-cat="国家队">国家队</button><button class="cat" data-cat="争议">争议</button><button class="cat" data-cat="趣闻">趣闻</button><button id="hour">只看1小时</button></div></div>
<div class="meta"><span id="count">加载中</span><span id="updated"></span><span id="status" class="warn">正在连接后台……</span></div>
<section id="top" class="top"><div class="label">当前最新</div><div class="title">正在加载……</div></section><main id="list" class="list"></main>
<footer>本站只显示简体中文新闻标题和来源标签，不复制文章正文。相同事件出现后续进展时，默认保留最新状态。</footer></div>
<script>
const $=s=>document.querySelector(s);let tier="全部",cat="全部",hours=0;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])}
function ago(v){const n=Date.parse(v);if(!n)return"";const m=Math.max(0,Math.round((Date.now()-n)/60000));if(m<60)return`${m}分钟前`;const h=Math.round(m/60);if(h<24)return`${h}小时前`;return`${Math.round(h/24)}天前`}
async function load(){try{const qs=new URLSearchParams({tier,category:cat,q:$("#q").value.trim(),hours:String(hours)});const r=await fetch("/api/news?"+qs.toString(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();const items=d.items||[];
$("#count").textContent=`${d.count} 条`;$("#updated").textContent=d.metrics?.syncedAt?`同步：${new Date(d.metrics.syncedAt).toLocaleTimeString("zh-CN",{hour12:false})}`:"";$("#status").textContent=`原始 ${d.metrics?.rawEntries||0} 条 · 事件合并后 ${d.metrics?.visibleEvents||0} 条 · 翻译缓存 ${d.metrics?.translationCache||0}`;$("#status").className="good";
const first=items[0];$("#top").innerHTML=first?`<div class="label">当前最新 · ${esc(first.source)}</div><div class="title">${esc(first.title)}</div>`:`<div class="label">当前最新</div><div class="title">当前筛选暂无快讯</div>`;
$("#list").innerHTML=items.length?items.map(x=>`<article class="item"><div class="info"><span class="tag">${esc(x.source)}</span><span class="tag">${esc(x.tier)}</span><span class="tag">${esc(x.category)}</span>${x.confirmations>1?`<span class="tag confirm">${x.confirmations}源交叉</span>`:""}<span>${esc(ago(x.publishedAt))}</span></div><div class="title">${esc(x.title)}</div></article>`).join(""):`<div class="empty">当前筛选没有标题。</div>`}catch(err){$("#count").textContent="加载失败";$("#status").textContent="接口请求失败："+(err?.message||err);$("#status").className="warn";$("#top").innerHTML=`<div class="label">连接异常</div><div class="title">新闻接口暂时不可用</div>`;$("#list").innerHTML=`<div class="empty">请稍后刷新页面。如果持续出现此提示，后台接口仍需修复。</div>`;}}
document.querySelectorAll(".tier").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tier").forEach(x=>x.classList.remove("active"));b.classList.add("active");tier=b.dataset.tier;load()});
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.cat;load()});
$("#hour").onclick=e=>{hours=hours?0:1;e.target.classList.toggle("active",!!hours);e.target.textContent=hours?"最近1小时 ✓":"只看1小时";load()};
let timer;$("#q").oninput=()=>{clearTimeout(timer);timer=setTimeout(load,150)};
$("#refresh").onclick=async e=>{e.target.disabled=true;e.target.textContent="刷新中…";await fetch("/api/refresh",{method:"POST"});setTimeout(async()=>{await load();e.target.disabled=false;e.target.textContent="刷新"},6500)};
load();setInterval(load,15000);
</script></body></html>
