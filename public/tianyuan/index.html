<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#173324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="向往田园">
<link rel="manifest" href="/tianyuan/manifest.webmanifest">
<link rel="apple-touch-icon" href="/tianyuan/icon.svg">
<title>向往田园 · 中国实景</title>
<style>
:root{--green:#173324;--green2:#2f5a42;--paper:#f4f0e4;--ink:#28372e;--muted:#7b827b;--line:rgba(45,66,51,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9e4d7;color:var(--ink)}button,input,select{font:inherit}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.top{position:fixed;left:0;right:0;top:0;z-index:20;height:calc(58px + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(18,40,27,.88),rgba(18,40,27,.46),transparent);color:white;pointer-events:none}
.brand,.topActions{pointer-events:auto}.brand b{display:block;font-family:"Songti SC","STSong",serif;font-size:17px;letter-spacing:.04em}.brand small{display:block;font-size:9px;color:rgba(255,255,255,.72);margin-top:2px}
.topActions{display:flex;gap:7px}.chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.11);color:white;border-radius:999px;padding:7px 9px;font-size:10px;backdrop-filter:blur(10px)}
main{max-width:1080px;margin:auto}.page{display:none}.page.active{display:block}
.hero{position:relative;height:min(64vh,620px);min-height:470px;overflow:hidden;background:linear-gradient(145deg,#233a2c,#6e7b62);background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,24,15,.04),rgba(8,24,15,.12) 45%,rgba(8,24,15,.72))}
.heroInner{position:absolute;z-index:3;left:22px;right:22px;bottom:30px;color:#fff}.heroKicker{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.72)}.hero h1{font-family:"Songti SC","STSong",serif;font-size:34px;margin:7px 0 6px;line-height:1.15}.hero p{max-width:620px;font-size:11px;line-height:1.65;color:rgba(255,255,255,.8);margin:0}
.heroBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.heroBtn{border:0;border-radius:999px;padding:10px 13px;font-size:10px;font-weight:800;background:#f5efe1;color:#26382d}.heroBtn.alt{background:rgba(255,255,255,.13);color:white;border:1px solid rgba(255,255,255,.22)}
.liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ec5a4c;margin-right:5px;box-shadow:0 0 0 4px rgba(236,90,76,.16);animation:pulse 1.7s infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(236,90,76,0)}}
.section{padding:16px 14px}.section h2{font-family:"Songti SC","STSong",serif;margin:0 0 4px;font-size:20px}.sub{font-size:10px;line-height:1.6;color:var(--muted)}
.featured{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}.liveCard{min-height:165px;border-radius:20px;padding:15px;display:flex;flex-direction:column;justify-content:space-between;color:white;background:linear-gradient(145deg,#244431,#54725a);box-shadow:0 10px 28px rgba(35,54,41,.12);position:relative;overflow:hidden}.liveCard:nth-child(2n){background:linear-gradient(145deg,#3e5363,#6f8291)}.liveCard:nth-child(3n){background:linear-gradient(145deg,#6c5738,#927557)}.liveCard:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.16),transparent 35%)}
.liveCard>*{position:relative;z-index:1}.liveCard b{font-family:"Songti SC","STSong",serif;font-size:18px}.liveCard small{font-size:9px;color:rgba(255,255,255,.72);line-height:1.45}.liveMeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{padding:4px 6px;border-radius:999px;background:rgba(255,255,255,.14);font-size:8px}.openBtn{align-self:flex-start;border:0;border-radius:999px;padding:8px 10px;background:rgba(255,255,255,.92);color:#26382d;font-size:9px;font-weight:900;margin-top:14px}
.card{background:rgba(248,245,236,.94);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:15px;box-shadow:0 12px 34px rgba(44,54,47,.08)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size:9px;color:#69736b}.filter.active{background:var(--green2);color:white;border-color:transparent}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sourceCard{border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px}.sourceCard b{display:block;font-size:13px}.sourceCard small{display:block;font-size:9px;color:#7c837d;line-height:1.55;margin-top:4px}.sourceFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px}.provider{font-size:8px;color:#708177}.btn{border:0;border-radius:999px;padding:8px 10px;background:var(--green2);color:white;font-size:9px;font-weight:800}.btn.alt{background:#eceae1;color:#59645b}
.picker{display:grid;gap:9px;margin-top:12px}.row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center}.row label{font-size:10px;color:#707870}.row select,.row input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 11px;color:#314037;outline:none}
.photo{height:280px;border-radius:20px;background:linear-gradient(135deg,#879681,#536a59) center/cover;position:relative;overflow:hidden}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,24,16,.72))}.photoText{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;color:white}.photoText b{display:block;font-family:"Songti SC","STSong",serif;font-size:20px}.photoText small{display:block;font-size:9px;color:rgba(255,255,255,.72);margin-top:4px}.credit{display:inline-block;margin-top:6px;color:rgba(255,255,255,.72);font-size:8px;text-decoration:none}
.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.role{border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 6px;text-align:center}.role.active{outline:2px solid #65816b;background:#f3f4eb}.role span{font-size:25px;display:block}.role b{font-size:9px;display:block;margin-top:3px}
.bottom{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(3,1fr);max-width:520px;margin:auto;padding:5px;border-radius:20px;background:rgba(20,39,28,.88);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);box-shadow:0 12px 36px rgba(0,0,0,.2)}.nav{border:0;background:transparent;color:rgba(255,255,255,.58);border-radius:15px;padding:8px 5px;font-size:9px}.nav i{font-style:normal;font-size:17px;display:block;margin-bottom:2px}.nav.active{background:rgba(255,255,255,.13);color:#fff}
.modal{position:fixed;inset:0;z-index:100;background:rgba(7,15,10,.62);display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.modalBox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#f5f1e7;border-radius:24px;padding:15px}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.modalHead h2{font-family:"Songti SC","STSong",serif;margin:0;font-size:19px}.frameWrap{height:min(62vh,520px);border-radius:17px;overflow:hidden;background:#17221b}.frameWrap iframe{width:100%;height:100%;border:0;background:#fff}.notice{font-size:9px;color:#7d827c;line-height:1.55;margin-top:9px}.toast{position:fixed;left:50%;bottom:100px;z-index:120;transform:translateX(-50%) translateY(10px);background:rgba(18,34,24,.91);color:#fff;border-radius:999px;padding:8px 12px;font-size:9px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:680px){.featured,.list{grid-template-columns:1fr}.hero{height:58vh;min-height:430px}.hero h1{font-size:29px}.section{padding:14px 10px}.row{grid-template-columns:76px 1fr}.photo{height:220px}.profile{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>向往田园</b><small>中国实景 · 公开直播</small></div>
  <div class="topActions"><button class="chip" id="roleChip" onclick="openProfile()">🌿 山野旅人</button></div>
</header>

<main>
<section class="page active" id="page-home">
  <div class="hero" id="hero">
    <div class="heroInner">
      <div class="heroKicker"><span class="liveDot"></span>PUBLIC LIVE · CHINA</div>
      <h1 id="heroTitle">现在，看看中国正在发生什么</h1>
      <p id="heroDesc">只接公开面向公众的官方实景直播，不接住宅、小区、村庄安防或任何需要绕过权限的摄像头。</p>
      <div class="heroBtns">
        <button class="heroBtn" onclick="goPage('live')">打开实时直播</button>
        <button class="heroBtn alt" onclick="goPage('scene')">选择中国实景</button>
      </div>
    </div>
  </div>
  <div class="section">
    <h2>正在直播</h2><div class="sub">央视网公开实时源，点击即可进入官方直播。</div>
    <div class="featured" id="featured"></div>
  </div>
</section>

<section class="page" id="page-scene">
  <div class="section" style="padding-top:calc(72px + env(safe-area-inset-top))">
    <div class="card">
      <h2>我的中国实景</h2>
      <div class="sub">省、市、县/区、镇/街道逐级选择；背景照片来自公开图库并保留来源。</div>
      <div class="picker">
        <div class="row"><label>省/地区</label><select id="province" onchange="provinceChanged()"></select></div>
        <div class="row"><label>市/州</label><select id="city" onchange="cityChanged()"></select></div>
        <div class="row"><label>县/区</label><select id="county" onchange="countyChanged()"></select></div>
        <div class="row"><label>镇/街道</label><select id="town" onchange="townChanged()"></select></div>
        <div class="row"><label>村/社区</label><input id="village" placeholder="可选：输入村、社区或自然村" oninput="villageChanged()"></div>
        <button class="btn" onclick="loadPlacePhoto()">查看这里的实景</button>
      </div>
    </div>
    <div style="height:10px"></div>
    <div class="photo" id="placePhoto">
      <div class="photoText"><b id="placeName">还没有选择地方</b><small id="placePath">从上面选一个地区</small><a class="credit" id="photoCredit" href="#" target="_blank" rel="noopener" style="display:none">查看图片来源</a></div>
    </div>
  </div>
</section>

<section class="page" id="page-live">
  <div class="section" style="padding-top:calc(72px + env(safe-area-inset-top))">
    <h2>中国公开实时直播</h2>
    <div class="sub">当前只收录官方公开页面。部分央视页面可能限制第三方内嵌，遇到黑屏时直接点“官方直播”即可。</div>
    <div class="filters" id="filters"></div>
    <div class="list" id="liveList"></div>
  </div>
</section>
</main>

<nav class="bottom">
  <button class="nav active" data-page="home" onclick="goPage('home')"><i>🏞️</i>首页</button>
  <button class="nav" data-page="scene" onclick="goPage('scene')"><i>📍</i>实景</button>
  <button class="nav" data-page="live" onclick="goPage('live')"><i>📡</i>直播</button>
</nav>

<div class="modal" id="modal">
  <div class="modalBox">
    <div class="modalHead"><h2 id="modalTitle">直播</h2><button class="btn alt" onclick="closeModal()">关闭</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const STORE="tianyuan_china_live_v1";
const ROLES={
  traveler:{icon:"🌿",name:"山野旅人"},
  observer:{icon:"🔭",name:"生态观察员"},
  photographer:{icon:"📷",name:"实景记录者"},
  wanderer:{icon:"🧭",name:"中国漫游者"}
};
let state={role:"traveler",location:{province:"",city:"",county:"",town:"",village:"",photo:null},filter:"全部"};
let lives=[];

try{
  const saved=JSON.parse(localStorage.getItem(STORE)||"null");
  if(saved&&typeof saved==="object")state=Object.assign(state,saved);
  if(!saved){
    const old=JSON.parse(localStorage.getItem("tianyuan_online_v41")||"null");
    if(old?.location?.province)state.location=Object.assign(state.location,old.location,{photo:old.location.photo?.gallery?null:old.location.photo||null});
  }
}catch(e){}

function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1600);}
window.goPage=function(page){
  document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id==="page-"+page));
  document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===page));
  window.scrollTo({top:0,behavior:"smooth"});
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function opt(items,value,placeholder){
  return '<option value="">'+placeholder+'</option>'+(items||[]).map(x=>'<option '+(x===value?'selected':'')+'>'+esc(x)+'</option>').join("");
}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}

async function loadLives(){
  try{const d=await getJSON("/api/tianyuan/public-lives");lives=d.items||[];}catch(e){lives=[];}
  renderLives();renderFeatured();
}
function renderFeatured(){
  const el=document.getElementById("featured");
  const picks=lives.filter(x=>x.id!=="livechina-home").slice(0,4);
  el.innerHTML=picks.map(x=>'<div class="liveCard"><div><b>'+esc(x.name)+'</b><small>'+esc(x.description)+'</small><div class="liveMeta"><span class="tag">● 直播</span><span class="tag">'+esc(x.place)+'</span></div></div><button class="openBtn" onclick="openLive(\''+esc(x.id)+'\')">进入直播</button></div>').join("")||'<div class="card">直播列表正在加载。</div>';
}
function renderLives(){
  const categories=["全部",...new Set(lives.map(x=>x.category))];
  document.getElementById("filters").innerHTML=categories.map(x=>'<button class="filter '+(state.filter===x?'active':'')+'" onclick="setFilter(\''+esc(x)+'\')">'+esc(x)+'</button>').join("");
  const arr=state.filter==="全部"?lives:lives.filter(x=>x.category===state.filter);
  document.getElementById("liveList").innerHTML=arr.map(x=>'<div class="sourceCard"><b><span class="liveDot"></span>'+esc(x.name)+'</b><small>'+esc(x.description)+'</small><div class="sourceFoot"><span class="provider">'+esc(x.provider)+' · '+esc(x.place)+'</span><button class="btn" onclick="openLive(\''+esc(x.id)+'\')">实时观看</button></div></div>').join("");
}
window.setFilter=function(v){state.filter=v;save();renderLives();}
window.openLive=function(id){
  const x=lives.find(v=>v.id===id);if(!x)return;
  document.getElementById("modalTitle").textContent=x.name;
  document.getElementById("modalBody").innerHTML=
    '<div class="frameWrap"><iframe src="'+esc(x.url)+'" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe></div>'+
    '<div class="notice">这是官方公开直播页面的内嵌尝试。若央视页面阻止第三方内嵌或在 iPhone 上显示空白，使用下面的“打开官方直播”即可正常观看。</div>'+
    '<div style="display:flex;gap:7px;margin-top:10px"><a class="btn" style="text-decoration:none" href="'+esc(x.url)+'" target="_blank" rel="noopener">打开官方直播</a><button class="btn alt" onclick="closeModal()">返回</button></div>';
  document.getElementById("modal").classList.add("show");
}
window.closeModal=function(){document.getElementById("modal").classList.remove("show");document.getElementById("modalBody").innerHTML="";}

async function loadProvinces(){
  try{
    const d=await getJSON("/api/tianyuan/regions");
    document.getElementById("province").innerHTML=opt(d.items,state.location.province,"选择省/地区");
    if(state.location.province)await restoreLocationSelectors();
  }catch(e){document.getElementById("province").innerHTML='<option>地区数据暂不可用</option>';}
}
async function restoreLocationSelectors(){
  const l=state.location;
  if(l.province){const d=await getJSON("/api/tianyuan/regions?province="+encodeURIComponent(l.province));document.getElementById("city").innerHTML=opt(d.items,l.city,"选择市/州");}
  if(l.province&&l.city){const d=await getJSON("/api/tianyuan/regions?province="+encodeURIComponent(l.province)+"&city="+encodeURIComponent(l.city));document.getElementById("county").innerHTML=opt(d.items,l.county,"选择县/区");}
  if(l.province&&l.city&&l.county){const d=await getJSON("/api/tianyuan/regions?province="+encodeURIComponent(l.province)+"&city="+encodeURIComponent(l.city)+"&county="+encodeURIComponent(l.county));document.getElementById("town").innerHTML=opt(d.items,l.town,"选择镇/街道");}
  document.getElementById("village").value=l.village||"";
  applyPlacePhoto();
}
window.provinceChanged=async function(){
  const l=state.location;l.province=document.getElementById("province").value;l.city=l.county=l.town=l.village="";l.photo=null;save();
  document.getElementById("city").innerHTML=opt([],null,"加载中…");document.getElementById("county").innerHTML=opt([],null,"先选城市");document.getElementById("town").innerHTML=opt([],null,"先选县区");
  if(l.province){const d=await getJSON("/api/tianyuan/regions?province="+encodeURIComponent(l.province));document.getElementById("city").innerHTML=opt(d.items,null,"选择市/州");}
  applyPlacePhoto();
}
window.cityChanged=async function(){
  const l=state.location;l.city=document.getElementById("city").value;l.county=l.town=l.village="";l.photo=null;save();
  document.getElementById("county").innerHTML=opt([],null,"加载中…");document.getElementById("town").innerHTML=opt([],null,"先选县区");
  if(l.city){const d=await getJSON("/api/tianyuan/regions?province="+encodeURIComponent(l.province)+"&city="+encodeURIComponent(l.city));document.getElementById("county").innerHTML=opt(d.items,null,"选择县/区");}
  applyPlacePhoto();
}
window.countyChanged=async function(){
  const l=state.location;l.county=document.getElementById("county").value;l.town=l.village="";l.photo=null;save();
  document.getElementById("town").innerHTML=opt([],null,"加载中…");
  if(l.county){const d=await getJSON("/api/tianyuan/regions?province="+encodeURIComponent(l.province)+"&city="+encodeURIComponent(l.city)+"&county="+encodeURIComponent(l.county));document.getElementById("town").innerHTML=opt(d.items,null,d.items?.length?"选择镇/街道":"暂无下一级");}
  applyPlacePhoto();
}
window.townChanged=function(){state.location.town=document.getElementById("town").value;state.location.village="";state.location.photo=null;document.getElementById("village").value="";save();applyPlacePhoto();}
window.villageChanged=function(){state.location.village=document.getElementById("village").value.trim();state.location.photo=null;save();applyPlacePhoto();}
window.loadPlacePhoto=async function(){
  const l=state.location,parts=[l.village,l.town,l.county,l.city,l.province].filter(Boolean);
  if(!parts.length){toast("先选择一个地区");return;}
  toast("正在找公开实景…");
  try{const d=await getJSON("/api/tianyuan/place-photo?q="+encodeURIComponent(parts.join(" ")));l.photo=d.photo||null;save();applyPlacePhoto();toast(l.photo?"实景已更新":"暂时没找到合适照片");}catch(e){toast("实景加载失败");}
}
function applyPlacePhoto(){
  const l=state.location,el=document.getElementById("placePhoto"),parts=[l.province,l.city,l.county,l.town,l.village].filter(Boolean);
  document.getElementById("placeName").textContent=l.village||l.town||l.county||l.city||l.province||"还没有选择地方";
  document.getElementById("placePath").textContent=parts.join(" · ")||"从上面选一个地区";
  const c=document.getElementById("photoCredit");
  if(l.photo?.url){el.style.backgroundImage="url('"+String(l.photo.url).replace(/'/g,"%27")+"')";c.style.display="inline-block";c.href=l.photo.sourceUrl||"#";c.textContent="图片来源 · "+(l.photo.license||"Wikimedia Commons");document.getElementById("hero").style.backgroundImage=el.style.backgroundImage;}
  else{el.style.backgroundImage="";c.style.display="none";}
}

window.openProfile=function(){
  const r=ROLES[state.role]||ROLES.traveler;
  document.getElementById("modalTitle").textContent="本机角色";
  document.getElementById("modalBody").innerHTML='<div class="sub">已删除账号和密码。角色只保存在这台设备，不上传密码，也不要求登录。</div><div class="profile">'+Object.entries(ROLES).map(([k,v])=>'<button class="role '+(state.role===k?'active':'')+'" onclick="chooseRole(\''+k+'\')"><span>'+v.icon+'</span><b>'+v.name+'</b></button>').join("")+'</div><div class="notice">更换手机时，可重新选择角色；原来的账号密码系统已经停用。</div>';
  document.getElementById("modal").classList.add("show");
}
window.chooseRole=function(k){if(!ROLES[k])return;state.role=k;save();renderRole();closeModal();toast("角色已切换");}
function renderRole(){const r=ROLES[state.role]||ROLES.traveler;document.getElementById("roleChip").textContent=r.icon+" "+r.name;}

async function init(){
