name: Build Capital Master APK

on:
  push:
    branches:
      - capital-master-apk
    paths:
      - 'capital-master-android/**'
      - '.github/workflows/build-capital-master-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: capital-master-android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp capital-master-android/app/build/outputs/apk/debug/app-debug.apk "output/京城大师成都公开赛_V1.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capital-master-chengdu-apk
          path: output/*.apk
          if-no-files-found: error
